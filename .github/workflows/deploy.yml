name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Atualiza diariamente as páginas lidas pelo Google e pelas IAs (06:17 em Brasília)
  schedule:
    - cron: '17 9 * * *'
  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Gerar páginas para Google e IAs (dados do Firebase)
        run: node scripts/prerender.mjs

      # Backup diário do conteúdo do site (psicólogas, fotos, artigos, convênios) — guardado 90 dias na aba Actions.
      # Se o backup falhar, o site continua sendo publicado normalmente.
      - name: Backup do conteúdo do site (Firebase)
        continue-on-error: true
        run: node scripts/backup-firestore.mjs

      - name: Guardar backup (90 dias)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backup-firestore-${{ github.run_number }}
          path: backup/
          retention-days: 90
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
