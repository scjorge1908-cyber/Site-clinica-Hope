name: Diagnostico tamanho dos dados (temporario)
on:
  push:
    branches: [perf-site]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Medir
        run: |
          node -e '
          const cfg=require("./firebase-applet-config.json");
          const base=`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/${cfg.firestoreDatabaseId}/documents`;
          const kb=n=>(n/1024).toFixed(0)+"KB";
          const kind=v=>{const s=v&&v.stringValue; if(!s) return ""; return s.startsWith("data:")?"base64":(s.startsWith("http")?"url:"+s.slice(0,60):"")};
          (async()=>{
            for(const c of ["settings","specialists","insurance_plans","approaches","psicoeducacao_articles"]){
              const r=await fetch(`${base}:runQuery?key=${cfg.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json",Referer:"https://clinicahopebrasil.com.br/"},body:JSON.stringify({structuredQuery:{from:[{collectionId:c}]}})});
              const t=await r.text(); const rows=JSON.parse(t).filter(x=>x.document);
              let msg=`${rows.length} docs, total ${kb(t.length)}`;
              if(c==="settings"){ for(const row of rows){ const f=row.document.fields||{}; const parts=Object.entries(f).map(([k,v])=>[k,JSON.stringify(v).length]).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,n])=>`${k}=${kb(n)}${kind(f[k])?"("+kind(f[k])+")":""}`); msg+=` | ${row.document.name.split("/").pop()}: ${parts.join(", ")}`; } }
              if(c==="specialists"){ const imgs=rows.map(x=>x.document.fields&&x.document.fields.img); const b=imgs.filter(v=>kind(v)==="base64"); const tot=imgs.reduce((s,v)=>s+(v?JSON.stringify(v).length:0),0); msg+=` | img: ${b.length} base64, soma ${kb(tot)}, maior ${kb(Math.max(...imgs.map(v=>v?JSON.stringify(v).length:0)))}`; }
              if(c==="insurance_plans"){ const l=rows.map(x=>x.document.fields&&x.document.fields.logo); msg+=` | logos base64: ${l.filter(v=>kind(v)==="base64").length}`; }
              console.log(`::notice title=${c}::${msg}`);
            }
          })();'
