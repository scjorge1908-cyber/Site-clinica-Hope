name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Atualiza diariamente as páginas lidas pelo Google e pelas IAs (06:17 em Brasília)
  schedule:
    - cron: '17 9 * * *'
  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Gerar páginas para Google e IAs (dados do Firebase)
        run: node scripts/prerender.mjs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
